name = "spike4_g474"
version = "0.1.0-dev"
description = "Ada Machine spike 4: I2C target exposing time + RNG on STM32G474"
long-description = "Ada Machine spike 4: I2C target (client) on STM32G474 (Nucleo-G474RE) exposing a settable epoch and hardware RNG words (Appendix D)"
authors = ["Manuel Stahl"]
maintainers = ["Manuel Stahl <thymythos@googlemail.com>"]
maintainers-logins = ["thymythos"]
licenses = "Apache-2.0 WITH LLVM-exception"
tags = ["embedded", "machine", "spike", "stm32g474", "i2c", "rng"]

executables = ["spike4_g474"]

#  Ada-only project; skip Alire's C-header generation for the config unit.
[configuration]
generate_c = false

[[depends-on]]
machine        = "*"
time_rng_target = "*"
stm32g474_hal  = "*"

[[pins]]
machine         = { path = "../machine" }
time_rng_target = { path = "../time_rng_target" }
stm32g474_hal   = { path = "../stm32g474_hal" }

# Not the default build (host_test is what is compiled and run to check the
# shared Time_RNG_Target logic). The real STM32G474 cross-build is the board
# crate ../spike4_g474_board, which reuses this crate's sources and links them
# against light_stm32g4xx with gnat_arm_elf (`make cross`). It pins
# SYSCLK_Src = HSI16 and DIV1 prescalers there, because the runtime's default
# 170 MHz PLL would silently break the I2C TIMINGR stm32g474_hal derives for
# HSI16 (16 MHz). Kept out of this manifest so `make` works without the
# runtime download; not flashed or run.
