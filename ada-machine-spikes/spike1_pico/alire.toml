name = "spike1_pico"
version = "0.1.0-dev"
description = "Ada Machine spike 1: BME280 on RP2040 over I2C, blocking"
long-description = "Ada Machine spike 1: BME280 on RP2040 (Raspberry Pi Pico) over I2C, blocking (Appendix B)"
authors = ["Manuel Stahl"]
maintainers = ["Manuel Stahl <thymythos@googlemail.com>"]
maintainers-logins = ["thymythos"]
licenses = "Apache-2.0 WITH LLVM-exception"
tags = ["embedded", "machine", "spike", "rp2040", "bme280"]

executables = ["spike1_pico"]

#  Ada-only project; skip Alire's C-header generation for the config unit.
[configuration]
generate_c = false

[[depends-on]]
machine = "*"
machine_blocking = "*"
machine_regmap = "*"
bme280 = "*"
rp2040_hal = "*"

#  Demonstrates the user-settable log level (§14.2): a dependent crate
#  overrides machine's "Log_Level" config variable from its own
#  alire.toml, which is how Machine.Log.Enabled_Level is meant to be
#  set in a real product build (default: Info).
[configuration.values]
machine.Log_Level = "Debug"

[[pins]]
machine          = { path = "../machine" }
machine_blocking = { path = "../machine_blocking" }
machine_regmap   = { path = "../machine_regmap" }
bme280   = { path = "../bme280" }
rp2040_hal       = { path = "../rp2040_hal" }

# The real RP2040 cross-build is the board crate ../spike1_pico_board, which
# reuses this crate's sources and links them against light_rp2040 with
# gnat_arm_elf (`make cross`); this crate stays the host stand-in. host_test
# is what is actually compiled and run to check the shared BME280 driver
# logic (Appendix A.3).
