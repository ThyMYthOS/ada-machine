name = "stm32g474_pac"
version = "0.1.0-dev"
description = "STM32G474 peripheral access crate (curated register bindings)"
long-description = "STM32G474 peripheral access crate (curated register bindings, spike 4 subset)"
authors = ["Manuel Stahl"]
maintainers = ["Manuel Stahl <thymythos@googlemail.com>"]
maintainers-logins = ["thymythos"]
licenses = "Apache-2.0 WITH LLVM-exception"
tags = ["embedded", "machine", "stm32g474", "pac"]

#  Ada-only project; skip Alire's C-header generation for the config unit.
[configuration]
generate_c = false

# Real PACs are generated from a curated SVD (patch overlay over the vendor
# SVD, §9 rule 1) and never hand-edited. This spike hand-authors the same
# shape directly -- the register subset the L2 crate (stm32g474_hal) needs
# for spike 4 (Appendix D): RCC enable bits, GPIOA/GPIOB, I2C1 (target
# mode), RNG, TIM2 (as a free-running seconds counter for Clock). NOT
# STM32G474's full register file.
#
# Base addresses (RCC/GPIOA/GPIOB/I2C1/TIM2/RNG) are cross-checked against
# the STM32G474xx CMSIS device header (stm32duino/Arduino_Core_STM32,
# itself derived from ST's CMSIS-Device pack). The RCC enable-bit
# *positions* (AHB2ENR.GPIOAEN/GPIOBEN/RNGEN, APB1ENR1.TIM2EN/I2C1EN),
# the RCC CRRCR HSI48 bits and the I2C1 ISR/ICR error-flag bits were
# checked against ST's cmsis-device-g4 stm32g474xx.h (TODO.md #11) --
# which corrected RNGEN from bit 18 (the L4 position) to bit 26. Still
# unchecked against silicon: this spike's validation is logic-only.
