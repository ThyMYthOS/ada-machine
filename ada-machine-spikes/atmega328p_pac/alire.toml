# AVR has no SVD culture (§9 AVR note): a real atmega328p_pac would be
# generated via ATDF->SVD conversion or a hand-authored SVD seeded from
# AVRAda's avrada_mcu. This spike hand-authors the same shape directly --
# only the registers rp2040_hal's counterpart, atmega328p_hal, needs for
# spike 2 (Appendix C): PORTB (GPIO/CS), SPI, and sleep control.
