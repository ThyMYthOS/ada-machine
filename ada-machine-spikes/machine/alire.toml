name = "machine"
version = "0.1.0-dev"
description = "Ada Machine: the portable contract (spec crate)"
long-description = "Ada Machine platform: the portable contract (spec crate)"
authors = ["Manuel Stahl"]
maintainers = ["Manuel Stahl <thymythos@googlemail.com>"]
maintainers-logins = ["thymythos"]
licenses = "Apache-2.0 WITH LLVM-exception"
tags = ["embedded", "machine"]

#  This is an Ada-only project; skip Alire's C-header generation for
#  the config unit (there is no C consumer for any crate in this repo).
[configuration]
generate_c = false

#  Machine.Log's static enabled threshold (§14.2): levels above this
#  fold away at compile time.
[configuration.variables]
Log_Level.type = "Enum"
Log_Level.values = ["Error", "Warning", "Info", "Debug", "Trace"]
Log_Level.default = "Info"
