name = "bme280"
version = "0.1.0-dev"
description = "Portable BME280 driver over the Ada Machine regmap signature"
long-description = "Portable BME280 driver over the Ada Machine regmap signature (I2C and SPI)"
authors = ["Manuel Stahl"]
maintainers = ["Manuel Stahl <thymythos@googlemail.com>"]
maintainers-logins = ["thymythos"]
licenses = "Apache-2.0 WITH LLVM-exception"
tags = ["embedded", "machine", "sensor", "bme280"]

#  Ada-only project; skip Alire's C-header generation for the config unit.
[configuration]
generate_c = false

[[depends-on]]
machine = "*"

[[pins]]
machine = { path = "../machine" }
