[[pins]]
machine          = { path = "../machine" }
machine_async    = { path = "../machine_async" }
machine_blocking = { path = "../machine_blocking" }
machine_regmap   = { path = "../machine_regmap" }
bme280   = { path = "../bme280" }
atmega328p_hal   = { path = "../atmega328p_hal" }

# Not cross-built in this environment (no avrada_rts/avr-gcc toolchain
