name = "spike2_avr"
version = "0.1.0-dev"
description = "Ada Machine spike 2: BME280 on ATmega328P over SPI, IRQ-driven"
long-description = "Ada Machine spike 2: BME280 on ATmega328P over SPI, interrupt-driven (Appendix C)"
authors = ["Manuel Stahl"]
maintainers = ["Manuel Stahl <thymythos@googlemail.com>"]
maintainers-logins = ["thymythos"]
licenses = "Apache-2.0 WITH LLVM-exception"
tags = ["embedded", "machine", "spike", "atmega328p", "avr", "bme280"]

executables = ["spike2_avr"]

[configuration.variables]
BME280_BUS = { type = "Enum", values = ["SPI", "I2C"], default = "SPI" }

[[depends-on]]
machine          = "*"
machine_async    = "*"
machine_blocking = "*"
machine_regmap   = "*"
bme280   = "*"
atmega328p_hal   = "*"
avrada_rts       = "*"

[[pins]]
machine          = { path = "../machine" }
machine_async    = { path = "../machine_async" }
machine_blocking = { path = "../machine_blocking" }
machine_regmap   = { path = "../machine_regmap" }
bme280   = { path = "../bme280" }
atmega328p_hal   = { path = "../atmega328p_hal" }
avrada_rts       = { path = "../avrada_rts" }

# `alr search avr` (§10) found avrada_rts/avrada_mcu/avrada_lib (Ada
# runtime + drivers for AVR, from RREE/AVRAda) and gnat_avr_elf (the
# AdaCore/GNAT-FSF AVR cross-compiler). gnat_avr_elf=15.3.1 installs and
# runs here, but ships no Ada runtime (no adainclude/adalib) -- and the
# registry's avrada_rts=2.0.1 depends on `gnat_avr_elf^11 | ^12.2`, whose
# macOS origins only publish X86_64 binaries (no Aarch64/Apple Silicon
# build), so it could not resolve on this host as published.
#
# ../avrada_rts is a local fork (cloned from RREE/AVRAda_RTS) with that
# constraint widened to also accept `^15.1`: its runtime sources
# (a-except, s-secsta, system.ads, etc., compiled with -gnatg against
# gnat_avr_elf's own avr-gnat1) needed no source changes to build clean
# against GCC 15.3 -- see ../avrada_rts/alire.toml. This crate now really
# is cross-built (see spike2_avr.gpr for the Target/Runtime wiring);
# host_test remains the one thing exercised against the native host GNAT.
