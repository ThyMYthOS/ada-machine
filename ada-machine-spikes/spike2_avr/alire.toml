name = "spike2_avr"
version = "0.1.0-dev"
description = "Ada Machine spike 2: BME280 on ATmega328P over SPI, IRQ-driven"
long-description = "Ada Machine spike 2: BME280 on ATmega328P over SPI, interrupt-driven (Appendix C)"
authors = ["Manuel Stahl"]
maintainers = ["Manuel Stahl <thymythos@googlemail.com>"]
maintainers-logins = ["thymythos"]
licenses = "Apache-2.0 WITH LLVM-exception"
tags = ["embedded", "machine", "spike", "atmega328p", "avr", "bme280"]

executables = ["spike2_avr"]

[[depends-on]]
machine          = "*"
machine_async    = "*"
