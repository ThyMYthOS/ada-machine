name = "clock_switch_e51"
description = "E51 monitor: clock switch executed from reserved DTIM"
long-description = """
Second example application, and the one that motivates tightly-integrated
memory rather than merely demonstrating it.

The E51 monitor core reconfigures the MSS clock. That changes L2 timing, so
code resident in L2 LIM cannot safely perform the switch -- it would be
reconfiguring the memory it is executing from. The same applies to an L2
`WayEnable` change, which moves LIM itself (RTS-POLARFIRE.md 6.4).

Microchip's own reference linker scripts reserve 1 KB at 0x01001c00 for
exactly this, named `switch_code_dtim`. This crate places the switch
sequence there via `pragma Linker_Section (..., ".switch_code")`, copies it
from its load address in LIM, issues `fence.i`, and only then calls it.

Note this is an E51 image: soft-float `lp64`, `rv64imac_zicsr_zifencei`.
light_mpfs derives that from Harts_Mask => 1 (hart 0 is the E51), so no
command-line ISA override is needed. The 1 KB reserved for the switch
sequence is set by this crate, not by the runtime -- see the project file.
"""
version = "0.1.0-dev"
licenses = "Apache-2.0 WITH LLVM-exception"
authors = ["Manuel Stahl"]
maintainers = ["Manuel Stahl <manuel.stahl@awesome-technologies.de>"]
maintainers-logins = ["thymythos"]
executables = ["clock_switch_e51"]

[[depends-on]]
light_mpfs = "*"

[[pins]]
light_mpfs = { path = "../light_mpfs" }

[configuration.values]
light_mpfs.Harts_Mask     = 1
light_mpfs.Memory_Profile    = "lim"
light_mpfs.DTIM_Ways         = 1
light_mpfs.Console           = "mmuart0"

#  No [environment] MPFS_ARCH/MPFS_ABI here any more. Those existed because
#  runtime.xml, being a gprconfig configuration project, could not see Alire's
#  crate configuration and needed the ISA passed as a GPR external. runtime.xml
#  is gone (CONTRACT.md 3.6/7.10): target_options.gpr derives the soft-float E51
#  ABI from Harts_Mask = 1 above, so setting it a second time here would be the
#  very "two knobs" hazard that change removed.
