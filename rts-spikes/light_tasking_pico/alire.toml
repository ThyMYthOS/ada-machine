name = "light_tasking_pico"
description = "Raspberry Pi Pico (RP2040/RP2350) Ravenscar Ada runtime"
long-description = """
Leaf crate of the rts-spikes hierarchy, mirroring
rts-spikes/CONTRACT.md §3: the buildable, Ravenscar-tasking Ada runtime for
the Raspberry Pi Pico family. There is no plain, non-tasking "light-rpi-pico"
runtime in the installed gnat_arm_elf 15.3.1 toolchain -- only
light-tasking-rpi-pico(-smp) and embedded-rpi-pico(-smp) are shipped -- so
this leaf is sourced from light-tasking-rpi-pico and is honestly named for
what it contains (see README.md "Blockers"). Owns
`for Runtime ("Ada") use Project'Project_Dir;` and produces
adalib/libgnat.a + libgnarl.a from the shared tier-1..3 source crates
(rts_sources_gcc15, rts_core_cortexm, rts_support_pico) plus its own
gnat_config/ (configuration renaming shim) and src/ (leaf-owned units,
committed under the ownership rule -- tier 1 tracks upstream, everything
below it is ours, CONTRACT.md 1 -- so ../populate.sh does not touch them).

The Device configuration variable selects tier 3's src-rp2040/ or src-rp2350/
overlay; it is not a second crate, and rts_support_pico carries both. rp2040
(Cortex-M0+, ARMv6-M) is the only value that BUILDS today, and the reason is
no longer the sources: what is missing is an RP2350 linker script pair, the
hard-float ISA switches, and this leaf's own rts_capabilities.ads for a
single-precision-only FPU. src/pico_config_checks.ads rejects the value and
names those, so the failure is a stated one rather than a mis-built image.
"""
version = "0.1.0-dev"
licenses = "GPL-3.0-or-later WITH GCC-exception-3.1"
authors = ["Free Software Foundation", "AdaCore"]
maintainers = ["Manuel Stahl <manuel.stahl@awesome-technologies.de>"]
maintainers-logins = ["thymythos"]
project-files = ["runtime_build.gpr", "ravenscar_build.gpr"]

#  Capability floor 2 = light-tasking (Ravenscar), on the ordered scale of
#  CONTRACT.md §3.1 -- same value as light_tasking_mpfs, since the floor is a
#  property of the PROFILE and not of the target.
provides = ["gnat_rts=2.0.0"]

[[depends-on]]
rts_sources_gcc15 = "*"
rts_core_cortexm = "*"
rts_support_pico = "*"
#  The cross compiler is a real dependency (puts arm-eabi-gcc in the build
#  environment), not an assumption about PATH -- mirrors rts-spikes/CONTRACT.md
#  §3.1's note re gnat_riscv64_elf / gnat_avr_elf / embedded_rp2040.
#  EXACTLY 15.3.1, not "^15": tier 1 is a snapshot of that release's runtime
#  sources (populate.sh asserts it), and "^15" also admits 15.2.1 / 15.3.1, which
#  a fresh machine would resolve to (RTS-PRODUCTION.md A3).
gnat_arm_elf = "=15.3.1"

#  ada_source_path is GENERATED from ada_source_path.in, at post-fetch and at
#  pre-build -- see ../light_mpfs/alire.toml for why both, and
#  RTS-PRODUCTION.md B1 for the measurements.
[[actions]]
type = "post-fetch"
command = ["sh", "gen-ada-source-path.sh", "post-fetch"]

[[actions]]
type = "pre-build"
command = ["sh", "gen-ada-source-path.sh", "pre-build"]

#  Tiers 1-3 are source-only siblings in this same working tree, never
#  published -- path-pinned rather than indexed (mirrors CONTRACT.md §1).
[[pins]]
rts_sources_gcc15 = { path = "../rts_sources_gcc15" }
rts_core_cortexm = { path = "../rts_core_cortexm" }
rts_support_pico = { path = "../rts_support_pico" }

[configuration]
output_dir = "gnat_config"
generate_c = false

#  Two configuration variables in this narrow spike (contrast light_mpfs's 15):
#  the device axis discovered while building this crate (README.md "Device
#  axis"), and the flash size. No Memory_Profile / Console / stack-size knobs.
[configuration.variables]
Device.type = "Enum"
Device.values = ["rp2040", "rp2350"]
Device.default = "rp2040"

#  Integer, not an Enum of the four sizes the published embedded_rp2040 crate
#  enumerates as directories. That crate's ld/flash-{2,4,8,16}/ differ in one
#  line each, so the four values are a NUMBER wearing a selector's clothes
#  (RTS.md 5.3 / A.25); as an Integer it reaches parts no directory set
#  enumerates. Consumed only as the PICO_FLASH_LENGTH defsym -- no compiled
#  unit reads it, which is why it is link-only (lists/config-tag-exempt.lst).
#  Default 2048 = the 2 MB W25Q16 on the original Raspberry Pi Pico, matching
#  the constant this replaced in rts_support_pico/ld/memory-map.ld.
Flash_Size_KB = { type = "Integer", first = 2048, last = 16384, default = 2048 }
