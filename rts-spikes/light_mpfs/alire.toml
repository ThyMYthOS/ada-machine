name = "light_mpfs"
description = "PolarFire SoC 'light' (no-tasking) Ada runtime for riscv64-elf"
long-description = """
Leaf crate of the rts-spikes hierarchy (CONTRACT.md §3): the buildable,
no-tasking Ada runtime for Microchip PolarFire SoC, riscv64-elf. Owns
`for Runtime ("Ada") use Project'Project_Dir;` and produces
adalib/libgnat.a from the shared tier-1..3 source crates
(rts_sources_gcc15, rts_core_riscv64, rts_support_mpfs) plus its own
gnat_config/ (configuration renaming shim) and src/ (system.ads,
s-parame.ads, populated -- not vendored -- from the installed
gnat_riscv64_elf toolchain by ../populate.sh; `make populate` is a
prerequisite for any build). It is this spike's critical-path leaf: the
only one of the three profiles with no tasking floor to clear, so the
only one that must build in the first milestone. See README.md for the
configuration-variable table and the standalone/derived mode split.
"""
version = "0.1.0-dev"
licenses = "GPL-3.0-or-later WITH GCC-exception-3.1"
authors = ["Free Software Foundation", "AdaCore"]
maintainers = ["Manuel Stahl <manuel.stahl@awesome-technologies.de>"]
maintainers-logins = ["thymythos"]
project-files = ["runtime_build.gpr"]

#  The capability FLOOR this leaf satisfies (CONTRACT.md §3.1). The profiles are
#  ORDERED -- light code compiles unchanged on light-tasking and embedded -- so
#  the floor is a version on one shared name rather than a per-capability name:
#  1 = light, 2 = light-tasking, 3 = embedded. A library needing tasking depends
#  on gnat_rts = ">=2.0.0" and will not resolve against this leaf.
#
#  This leaf declares 1.0.0 rather than nothing, which is a change from the
#  earlier contract: silence is indistinguishable from a leaf nobody classified.
provides = ["gnat_rts=1.0.0"]

[[depends-on]]
rts_sources_gcc15 = "*"
rts_core_riscv64 = "*"
rts_support_mpfs = "*"
#  The cross compiler is a real dependency, not an assumption about PATH: it is
#  what puts riscv64-elf-gcc in the build environment. Without it an application
#  builds only in a shell that happens to have the toolchain exported, and
#  otherwise fails with `no compiler for language "Asm_Cpp"` as gprbuild falls
#  back to the native compiler. Both avrada_rts (gnat_avr_elf) and
#  embedded_rp2040 (gnat_arm_elf) declare theirs the same way.
#  EXACTLY 15.1.2, not "^15": tier 1 is a snapshot of that release's runtime
#  sources (populate.sh asserts it), and "^15" also admits 15.2.1 / 15.3.1, which
#  a fresh machine would resolve to (RTS-PRODUCTION.md A3).
gnat_riscv64_elf = "=15.1.2"

#  ada_source_path is GENERATED from ada_source_path.in (RTS-PRODUCTION.md B1,
#  which has the measurements behind this block). It names directories of the
#  tier crates, whose location exists only once Alire has deployed them. Every
#  action of every crate in the solution -- dependencies', not just the root's --
#  sees <CRATE>_ALIRE_PREFIX for every crate in the solution, and a dependency's
#  actions all run before the root's gprbuild. The one idempotent script runs
#  at two points because each covers a flow the other misses:
#    post-fetch  once per deployment into a build directory; the only one that
#                covers a flow bypassing `alr build` (`alr exec -- gprbuild`).
#                Does NOT run for a path-pinned crate (nothing is fetched).
#    pre-build   every `alr build`, pinned or fetched; the one that cannot go
#                stale if the file is deleted or a pin is moved.
[[actions]]
type = "post-fetch"
command = ["sh", "gen-ada-source-path.sh"]

[[actions]]
type = "pre-build"
command = ["sh", "gen-ada-source-path.sh"]

#  Tiers 1-3 are source-only siblings in this same working tree, never
#  published (CONTRACT.md §1) -- path-pinned rather than indexed.
[[pins]]
rts_sources_gcc15 = { path = "../rts_sources_gcc15" }
rts_core_riscv64 = { path = "../rts_core_riscv64" }
rts_support_mpfs = { path = "../rts_support_mpfs" }

[configuration]
output_dir = "gnat_config"
generate_c = false

#  CONTRACT.md §3.2 -- names, types and defaults are pinned.
[configuration.variables]
#  Hart bitmask: bit N = hart N. Bit 0 is the E51, bits 1..4 the U54s.
#  An Integer, so every derived value (count, first hart, CLINT offset)
#  is STATIC -- a String forces indexing, which RM 4.9 makes non-static
#  and which silently defeats number declarations (CONTRACT.md 7.8).
Harts_Mask = { type = "Integer", first = 1, last = 31, default = 2 }

#  Whether this image is the first thing running on its hart set (primary,
#  must be ready to park the harts it does not own) or launched by a
#  supervisor/JTAG that has already placed and released it (secondary, must
#  touch no other hart at all). Orthogonal to the boot medium (envm/lim/...),
#  which the linker already answers via __data_load vs __data_start
#  (RTS-PRODUCTION.md §A6, start.S).
Boot_Role.type = "Enum"
Boot_Role.values = ["primary", "secondary"]
Boot_Role.default = "primary"

#  Main task stack, reserved by the placement script. The scripts default to
#  2 MB, which does not fit a 1920 KB LIM (RTS-POLARFIRE 1.2.1).
Main_Stack_Size = { type = "Integer", first = 4096, default = 65536 }




Privilege.type = "Enum"
Privilege.values = ["m_mode", "s_mode"]
Privilege.default = "m_mode"

Memory_Profile.type = "Enum"
Memory_Profile.values = [
   "envm",
   "lim",
   "lim_lma_scratchpad_vma",
   "envm_lma_scratchpad_vma",
   "ddr_by_bootloader",
   "system_partition",
]
Memory_Profile.default = "lim"

L2_Cache_Ways.type = "Integer"
L2_Cache_Ways.first = 0
L2_Cache_Ways.last = 16
L2_Cache_Ways.default = 1

L2_LIM_Ways.type = "Integer"
L2_LIM_Ways.first = 0
L2_LIM_Ways.last = 16
L2_LIM_Ways.default = 15

L2_Scratchpad_Ways.type = "Integer"
L2_Scratchpad_Ways.first = 0
L2_Scratchpad_Ways.last = 16
L2_Scratchpad_Ways.default = 0

ITIM_Ways.type = "Integer"
ITIM_Ways.first = 0
ITIM_Ways.last = 3
ITIM_Ways.default = 0

DTIM_Ways.type = "Integer"
DTIM_Ways.first = 0
DTIM_Ways.last = 3
DTIM_Ways.default = 0

DDR_Present.type = "Boolean"
DDR_Present.default = false

DDR_Cached_KB.type = "Integer"
DDR_Cached_KB.default = 0

DDR_NonCached_KB.type = "Integer"
DDR_NonCached_KB.default = 0

DDR_WCB_KB.type = "Integer"
DDR_WCB_KB.default = 0

Console.type = "Enum"
Console.values = [
   "mmuart0",
   "mmuart1",
   "mmuart2",
   "mmuart3",
   "mmuart4",
   "ram_fifo",
   "none",
]
Console.default = "mmuart0"

Interrupt_Stack_Size.type = "Integer"
Interrupt_Stack_Size.default = 8192

Secondary_Stack_Size.type = "Integer"
Secondary_Stack_Size.default = 2048

MPFS_PARTITION.type = "String"
MPFS_PARTITION.default = ""
