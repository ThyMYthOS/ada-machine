name = "light_tasking_mpfs"
description = "MPFS light-tasking (Ravenscar/Jorvik) GNAT runtime leaf"
long-description = """
Buildable leaf crate (CONTRACT.md §3) for the `light-tasking` (Ravenscar/
Jorvik) GNAT runtime profile on Microchip PolarFire SoC, riscv64-elf.

Unlike `light_mpfs`, this profile has tasking: two library projects,
`runtime_build.gpr` (libgnat) and `ravenscar_build.gpr` (libgnarl), both
producing archives into the same `adalib`. It composes tier 1
(`rts_sources_gcc15`), tier 2 (`rts_core_riscv64`) and tier 3
(`rts_support_mpfs`) source-only crates per CONTRACT.md, adding only the
leaf-owned units (`system.ads`, `s-parame.ads/adb`, `s-bbpara.ads`),
configuration variables, and the metadata files a runtime directory needs.
"""
version = "0.1.0-dev"
licenses = "GPL-3.0-or-later WITH GCC-exception-3.1"
authors = ["Free Software Foundation", "AdaCore"]
maintainers = ["Manuel Stahl <manuel.stahl@awesome-technologies.de>"]
maintainers-logins = ["thymythos"]

project-files = ["runtime_build.gpr", "ravenscar_build.gpr"]

#  This profile has tasking (unlike light_mpfs, whose floor excludes it,
#  RTS.md §4) -- see README.md for why this declaration belongs here and
#  not on light_mpfs.
provides = ["gnat_rts_tasking=0.1.0"]

[[depends-on]]
rts_sources_gcc15 = "*"
rts_core_riscv64 = "*"
rts_support_mpfs = "*"

[configuration]
output_dir = "gnat_user"
generate_c = false

[configuration.variables]
#  Main task stack, reserved by the placement script, which otherwise
#  defaults to 2 MB -- more than a 1920 KB LIM can hold.
Main_Stack_Size = { type = "Integer", first = 4096, default = 65536 }

#  Hart bitmask: bit N = hart N. Bit 0 is the E51, bits 1..4 the U54s.
#  An Integer, so every derived value (count, first hart, CLINT offset)
#  is STATIC -- a String forces indexing, which RM 4.9 makes non-static
#  and which silently defeats number declarations (CONTRACT.md 7.8).
Harts_Mask = { type = "Integer", first = 1, last = 31, default = 2 }

Privilege = { type = "Enum", values = ["m_mode", "s_mode"], default = "m_mode" }
Memory_Profile = { type = "Enum", values = ["envm", "lim", "lim_lma_scratchpad_vma", "envm_lma_scratchpad_vma", "ddr_by_bootloader", "system_partition"], default = "lim" }
L2_Cache_Ways = { type = "Integer", first = 0, last = 16, default = 1 }
L2_LIM_Ways = { type = "Integer", first = 0, last = 16, default = 15 }
L2_Scratchpad_Ways = { type = "Integer", first = 0, last = 16, default = 0 }
ITIM_Ways = { type = "Integer", first = 0, last = 3, default = 0 }
DTIM_Ways = { type = "Integer", first = 0, last = 3, default = 0 }
DDR_Present = { type = "Boolean", default = false }
DDR_Cached_KB = { type = "Integer", default = 0 }
DDR_NonCached_KB = { type = "Integer", default = 0 }
DDR_WCB_KB = { type = "Integer", default = 0 }
Console = { type = "Enum", values = ["mmuart0", "mmuart1", "mmuart2", "mmuart3", "mmuart4", "ram_fifo", "none"], default = "mmuart0" }
Interrupt_Stack_Size = { type = "Integer", default = 8192 }
Secondary_Stack_Size = { type = "Integer", default = 2048 }
MPFS_PARTITION = { type = "String", default = "" }

#  Tiers 1-3 are source-only siblings in this working tree, never published
#  (CONTRACT.md 1) -- path-pinned rather than indexed. Required for the
#  `with "rts_sources_gcc15.gpr"` in runtime_build.gpr to resolve (7.5).
[[pins]]
rts_sources_gcc15 = { path = "../rts_sources_gcc15" }
rts_core_riscv64  = { path = "../rts_core_riscv64" }
rts_support_mpfs  = { path = "../rts_support_mpfs" }
