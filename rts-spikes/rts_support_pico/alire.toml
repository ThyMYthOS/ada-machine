name = "rts_support_pico"
description = "Tier 3: Raspberry Pi Pico board support -- startup, linker scripts"
long-description = """
Tier 3 of the rts-spikes hierarchy, mirroring rts-spikes/rts_support_mpfs:
board support for the Raspberry Pi Pico family -- the boot2 second-stage
bootloader, the ROM entry point, the peripheral register interfaces used at
startup (clocks, PLL, resets, ROSC/XOSC, timer, watchdog, SIO, PSM),
System.BB.Board_Parameters and System.BB.MCU_Parameters, and the
common-ROM/memory-map linker scripts. Source-only and never built by Alire.

Named for the FAMILY, not a device, because that is what tier 3 varies by
(RTS.md 6): it serves both RP2040 and RP2350. Measured against the published
light_rp2040 / light_rp2350 crates, 378 of ~400 units are byte-identical and
the device-only names are disjoint, so one directory of 19 device-neutral
units plus a five-file src-rp2040/ and src-rp2350/ overlay covers both. See
README.md for the measurement and for what an RP2350 leaf still lacks.

Owned, not populated: tier 1 tracks upstream and everything below it is ours
(CONTRACT.md 1), so these sources are committed and hand-editable, and
../populate.sh does not touch them.
"""
