name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # One cache, keyed on the crate manifests: the action's own cache
      # (cache: true) uses a key that only changes with the Alire version,
      # so toolchains first fetched during the build (gnat_avr_elf, ...)
      # would never be saved. Restored before setup so the toolchain
      # selection sees what is already there.
      - name: Cache Alire toolchains and crates
        uses: actions/cache@v6
        with:
          path: |
            ~/.local/share/alire
            ~/.cache/alire
            ~/.alire
          key: alire-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/alire.toml') }}
          restore-keys: |
            alire-${{ runner.os }}-${{ runner.arch }}-

      - name: Install Alire
        uses: alire-project/setup-alire@v6
        with:
          cache: false

      - name: Build all crates
        run: make all ALR="alr -n"
        working-directory: ada-machine-spikes

      # host_test plus the log-decoder self-test (tools/test_decode_log.py:
      # real Log_Sink/test-mode-runner bytes from Ada, decoded by Python 3).
      - name: Run host_test and the log-decoder self-test
        run: make test ALR="alr -n"
        working-directory: ada-machine-spikes

      # Same GNATprove as the local reference setup (FSF 16.1.0), from the
      # Alire index rather than Ubuntu's older distro package.
      - name: Install gnatprove
        run: |
          alr -n install gnatprove=16.1.0
          echo "$HOME/.alire/bin" >> "$GITHUB_PATH"

      - name: Run GNATprove
        run: make gnatprove ALR="alr -n"
        working-directory: ada-machine-spikes

  cross:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Separate cache key from the host job: the cross toolchains
      # (gnat_arm_elf, gnat_avr_elf, gnat_riscv64_elf) and runtimes are
      # large and would bloat the host job's cache.
      - name: Cache Alire toolchains and crates
        uses: actions/cache@v6
        with:
          path: |
            ~/.local/share/alire
            ~/.cache/alire
            ~/.alire
          key: alire-cross-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/alire.toml') }}
          restore-keys: |
            alire-cross-${{ runner.os }}-${{ runner.arch }}-

      - name: Install Alire
        uses: alire-project/setup-alire@v6
        with:
          cache: false

      # spike1_pico_board, spike4_g474_board, spike2_avr (both bus variants)
      # link real ELFs; esp32c3_pac/_hal are only compiled for RISC-V
      # (spike3_esp is not linked, runtime pending, see TODO.md #15).
      - name: Cross-build all targets
        run: make cross ALR="alr -n"
        working-directory: ada-machine-spikes

      # Test-mode variants (ADA_MACHINE_TEST_MODE=on): run a few measurement
      # cycles, write `ADA-MACHINE-TEST: PASS|FAIL <code>` to the UART and
      # halt, for the simulator jobs (TODO.md #15 Step 2/3). Built into
      # separate bin/test dirs, so the normal ELFs above are untouched.
      - name: Cross-build the test-mode variants
        run: make cross-test ALR="alr -n"
        working-directory: ada-machine-spikes

      - name: Upload spike1_pico (RP2040) ELF
        uses: actions/upload-artifact@v7
        with:
          name: spike1_pico-rp2040-elf
          path: ada-machine-spikes/spike1_pico_board/bin/spike1_pico
          if-no-files-found: error

      - name: Upload spike2_avr (ATmega328P) ELFs
        uses: actions/upload-artifact@v7
        with:
          name: spike2_avr-atmega328p-elf
          path: |
            ada-machine-spikes/spike2_avr/bin/spi/spike2_avr
            ada-machine-spikes/spike2_avr/bin/i2c/spike2_avr
          if-no-files-found: error

      - name: Upload spike4_g474 (STM32G474) ELF
        uses: actions/upload-artifact@v7
        with:
          name: spike4_g474-stm32g474-elf
          path: ada-machine-spikes/spike4_g474_board/bin/spike4_g474
          if-no-files-found: error

      - name: Upload spike1_pico (RP2040) test-mode ELF
        uses: actions/upload-artifact@v7
        with:
          name: spike1_pico-rp2040-testmode-elf
          path: ada-machine-spikes/spike1_pico_board/bin/test/spike1_pico
          if-no-files-found: error

      - name: Upload spike2_avr (ATmega328P) test-mode ELFs
        uses: actions/upload-artifact@v7
        with:
          name: spike2_avr-atmega328p-testmode-elf
          path: |
            ada-machine-spikes/spike2_avr/bin/spi/test/spike2_avr
            ada-machine-spikes/spike2_avr/bin/i2c/test/spike2_avr
          if-no-files-found: error

  # TODO.md #15 Step 3: run the spike2_avr test-mode ELFs from the cross job
  # in simavr against a simulated BME280 (ada-machine-spikes/sim/avr).
  sim-avr:
    runs-on: ubuntu-24.04
    needs: cross
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Uploaded with two paths, so the artifact root is spike2_avr/bin:
      # elfs/spi/test/spike2_avr and elfs/i2c/test/spike2_avr.
      - name: Download the spike2_avr test-mode ELFs
        uses: actions/download-artifact@v8
        with:
          name: spike2_avr-atmega328p-testmode-elf
          path: elfs

      # simavr v1.7, the version nixpkgs provides for local runs
      # (sim/avr/shell.nix), built from source: Ubuntu 24.04 through 26.04
      # only package 1.6, whose TWI model differs (the I2C cases fail there).
      # gcc-avr/avr-libc provide the device headers simavr's cores are built
      # from; the harness links libsimavr.a statically via SIMAVR_PREFIX.
      - name: Build simavr v1.7 from source
        env:
          SIMAVR_REF: v1.7
          SIMAVR_COMMIT: 1d227277b3d0039f9faef9ea62880ca3051b14f8
        run: |
          sudo apt-get update
          sudo apt-get install -y libelf-dev gcc-avr avr-libc
          git clone --depth 1 --branch "$SIMAVR_REF" \
            https://github.com/buserror/simavr.git "$RUNNER_TEMP/simavr-src"
          test "$(git -C "$RUNNER_TEMP/simavr-src" rev-parse HEAD)" = "$SIMAVR_COMMIT"
          make -C "$RUNNER_TEMP/simavr-src" install-simavr RELEASE=1 \
            DESTDIR="$RUNNER_TEMP/simavr" PREFIX="$RUNNER_TEMP/simavr"
          echo "SIMAVR_PREFIX=$RUNNER_TEMP/simavr" >> "$GITHUB_ENV"

      - name: Build the simavr harness
        run: make -C ada-machine-spikes/sim/avr

      - name: Run the four simulation cases
        run: make -C ada-machine-spikes/sim/avr run ELF_DIR="$GITHUB_WORKSPACE/elfs"

      # Same cases with the SPIF-in-ISR and TWINT-after-STOP behaviours
      # relaxed in the model (see TODO.md #15): shows that the harness and the
      # BME280 model are sound independently of those two findings.
      - name: Run the diagnostic cases
        if: always()
        run: make -C ada-machine-spikes/sim/avr run-diag ELF_DIR="$GITHUB_WORKSPACE/elfs"

      - name: Upload the captured logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: spike2_avr-simavr-logs
          path: ada-machine-spikes/sim/avr/logs
          if-no-files-found: warn
