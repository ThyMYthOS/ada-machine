name = "rts_sources_gcc15_arm"
description = "Tier 1: shared libgnat/libgnarl source snapshot for arm-eabi"
long-description = """
Tier 1 of the rts-spikes-rp2040 hierarchy, mirroring rts-spikes/CONTRACT.md
§2: source-only, never built by Alire (these units need -gnatg -nostdinc,
the cross compiler and no runtime, a bootstrap cycle). Sources are copied
out of an installed gnat_arm_elf 15.1.2 by ../populate.sh, not vendored --
see README.md. Also holds the Device-keyed sqrt overlay (armv6m populated,
armv8m not: no RP2350 runtime ships in this toolchain).
"""
version = "0.1.0-dev"
